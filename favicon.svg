<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="8" fill="#0a0a0f"/>

  <!-- Subtle grid lines (like the app background) -->
  <line x1="0" y1="10" x2="32" y2="10" stroke="#00e5a0" stroke-opacity="0.08" stroke-width="0.5"/>
  <line x1="0" y1="20" x2="32" y2="20" stroke="#00e5a0" stroke-opacity="0.08" stroke-width="0.5"/>
  <line x1="10" y1="0" x2="10" y2="32" stroke="#00e5a0" stroke-opacity="0.08" stroke-width="0.5"/>
  <line x1="20" y1="0" x2="20" y2="32" stroke="#00e5a0" stroke-opacity="0.08" stroke-width="0.5"/>

  <!-- Upward trending arrow — freedom from debt -->
  <!-- Bar chart base bars (debt going down) -->
  <rect x="5" y="20" width="5" height="8" rx="1.5" fill="#2a2a3f"/>
  <rect x="13" y="15" width="5" height="13" rx="1.5" fill="#2a2a3f"/>
  <rect x="21" y="10" width="5" height="18" rx="1.5" fill="#2a2a3f"/>

  <!-- Green progress fills (paying off) -->
  <rect x="5" y="24" width="5" height="4" rx="1.5" fill="#00e5a0" opacity="0.9"/>
  <rect x="13" y="21" width="5" height="7" rx="1.5" fill="#00e5a0" opacity="0.9"/>
  <rect x="21" y="16" width="5" height="12" rx="1.5" fill="#00e5a0" opacity="0.9"/>

  <!-- Upward arrow on top -->
  <polyline points="6,14 13,8 20,11 27,4"
    fill="none" stroke="#00e5a0" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="27,4 23,4 27,8"
    fill="#00e5a0"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="32" height="2" rx="1" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
